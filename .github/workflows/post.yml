# Posts the next reel of each app. Runs daily; can also be started by hand (check / post / dry).
name: Post

on:
  workflow_dispatch:
    inputs:
      command:
        description: "check | stats | post | dry | daily (daily = post unless one went out in the last 20 hours; used by the cron Worker)"
        required: true
        default: check
  schedule:
    # 16:00 UTC = 19:00 Istanbul: US morning, Europe evening. Off the hour, since GitHub drops
    # scheduled runs at busy times; the later times are fallbacks (ig.py skips if already posted).
    - cron: "11 16 * * *"
    - cron: "41 17 * * *"
    - cron: "17 19 * * *"

permissions:
  contents: write

concurrency: post

jobs:
  tolk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_ACCESS_TOKEN: ${{ secrets.TOLK_IG_TOKEN }}
      IG_USER_ID: "17841429640015233"
    steps:
      - uses: actions/checkout@v4
      - name: Check
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'check'
        run: python3 tools/ig.py check
      - name: Stats
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'stats'
        run: python3 tools/ig.py stats
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'dry'
        run: python3 tools/ig.py post tolk --dry
      - name: Post
        if: github.event_name == 'schedule' || inputs.command == 'post' || inputs.command == 'daily'
        env:
          POST_GUARD: ${{ (github.event_name == 'schedule' || inputs.command == 'daily') && '1' || '' }}
        run: |
          python3 tools/ig.py post tolk
          if [ -n "$(git status --porcelain tolk/posted.txt)" ]; then
            git config user.name "myndos-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tolk/posted.txt
            git commit -m "tolk: posted $(tail -n1 tolk/posted.txt)"
            git pull --rebase && git push || (git pull --rebase && git push)
          fi
