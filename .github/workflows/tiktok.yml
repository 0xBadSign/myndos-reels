# Posts the next video to TikTok. Started by the cron Worker (daily) or by hand (check / dry / post).
name: TikTok

on:
  workflow_dispatch:
    inputs:
      command:
        description: "check | dry | post | daily (daily = post unless one went out in the last 20 hours; used by the cron Worker)"
        required: true
        default: check

permissions:
  contents: write

concurrency: tiktok

jobs:
  tolk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISHER_KEY: ${{ secrets.PUBLISHER_KEY }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check
        if: inputs.command == 'check'
        run: python3 tools/tiktok.py check tolk
      - name: Dry run
        if: inputs.command == 'dry'
        run: python3 tools/tiktok.py post tolk --dry
      - name: Post
        if: inputs.command == 'post' || inputs.command == 'daily'
        env:
          POST_GUARD: ${{ inputs.command == 'daily' && '1' || '' }}
        run: |
          python3 tools/tiktok.py post tolk
          if [ -n "$(git status --porcelain tolk/posted_tiktok.txt)" ]; then
            git config user.name "myndos-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tolk/posted_tiktok.txt tolk/tiktok_last_posted_at.txt
            git commit -m "tolk: posted to TikTok $(tail -n1 tolk/posted_tiktok.txt)"
            git pull --rebase && git push || (git pull --rebase && git push)
          fi
