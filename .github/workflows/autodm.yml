# Sends the App Store link as a private reply to people who comment a keyword on our reels.
name: Auto DM

on:
  workflow_dispatch:
    inputs:
      command:
        description: "run | dry"
        required: true
        default: dry
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency: autodm

jobs:
  tolk:
    # The schedule stays off until the repo variable AUTODM_ENABLED is 'true' (token with comment and message scopes).
    if: github.event_name == 'workflow_dispatch' || vars.AUTODM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.TOLK_IG_TOKEN }}
      IG_USER_ID: "17841429640015233"
    steps:
      - uses: actions/checkout@v4
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'dry'
        run: python3 tools/autodm.py run tolk --dry
      - name: Run
        if: github.event_name == 'schedule' || inputs.command == 'run'
        run: |
          python3 tools/autodm.py run tolk
          if [ -n "$(git status --porcelain tolk/dm_sent.txt)" ]; then
            git config user.name "myndos-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tolk/dm_sent.txt
            git commit -m "tolk: auto dm"
            git pull --rebase && git push || (git pull --rebase && git push)
          fi
